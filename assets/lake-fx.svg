.bob{ animation:bob 5s ease-in-out infinite } .bobR{ animation:bob 5s ease-in-out infinite reverse }
.rip{ transform-box:fill-box; transform-origin:center; animation:rip 7.2s ease-out infinite; opacity:0 }
